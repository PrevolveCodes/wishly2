<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create an account — Wishly</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/app.css"></head><body class="auth-body"><a class="brand auth-brand" href="./"><span class="brand-mark">w</span> wishly</a><main class="auth-wrap"><section class="auth-card"><span class="eyebrow">GET STARTED</span><h1 class="auth-title">A list for<br>what you love.</h1><p class="muted">Create your Wishly account.</p><form id="signup-form"><label>Display name<input type="text" id="displayName" autocomplete="name" maxlength="40" required></label><label>Email address<input type="email" id="email" autocomplete="email" required></label><label>Password<input type="password" id="password" autocomplete="new-password" minlength="8" required></label><label>Confirm password<input type="password" id="confirmPassword" autocomplete="new-password" minlength="8" required></label><button class="button button-dark full" type="submit">Create account</button></form><div class="or-line"><span>or</span></div><button class="button google-button full" id="google" type="button">Sign up with Google</button><p class="auth-bottom">Already have an account? <a href="login.html">Log in</a></p><p class="form-message" id="message" role="status"></p></section></main><script type="module" src="js/auth.js"></script></body></html>
