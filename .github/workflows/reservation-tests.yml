name: Reservation security tests

on:
  push:
    branches:
      - main
      - test/emulator-suite
      - reservation-password-repair
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Check browser-compatible password hashing
        run: npm run test:crypto

      - name: Run Firestore Rules Emulator tests
        run: npm run test:emulator
