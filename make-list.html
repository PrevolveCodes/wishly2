<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Make a list — Wishly</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/app.css"></head><body class="app-body"><aside class="sidebar"><a class="brand" href="dashboard.html"><span class="brand-mark">w</span> wishly</a><nav><span class="nav-caption">WORKSPACE</span><a class="nav-link" href="dashboard.html">◫ &nbsp; Overview</a><a class="nav-link active" href="make-list.html">＋ &nbsp; Make a list</a><a class="nav-link" href="my-lists.html">▤ &nbsp; My lists</a><a class="nav-link" href="families.html">⌂ &nbsp; Families</a></nav><div class="sidebar-bottom"><button id="logout" class="nav-link">↪ &nbsp; Log out</button></div></aside><main class="app-main"><header class="app-top"><span>YOUR WORKSPACE</span><span class="avatar">W</span></header><section class="app-content narrow"><a class="back-link" href="dashboard.html">← Back to overview</a><span class="eyebrow">A NEW COLLECTION</span><h1 class="page-title">Make a list.</h1><p class="muted">Start with the basics. You can add wishes next.</p><form id="create-list" class="panel form-stack"><label>List title<input class="app-input" id="title" maxlength="80" placeholder="e.g. Birthday wishes" required></label><label>Description <span class="optional">OPTIONAL</span><textarea class="app-input" id="description" rows="3" maxlength="500" placeholder="A little context for the people you share this with"></textarea></label><div class="two-fields"><label>Occasion <span class="optional">OPTIONAL</span><input class="app-input" id="occasion" maxlength="50" placeholder="Birthday, holiday…"></label><label>Event date <span class="optional">OPTIONAL</span><input class="app-input" id="eventDate" type="date"></label></div><label>Who can open this list?<select class="app-input" id="visibility"><option value="public">Anyone with the link</option><option value="private">Only me (private)</option></select></label><button class="button button-dark" type="submit">Create list →</button><p id="message" class="form-message"></p></form></section></main><script type="module" src="js/lists.js"></script></body></html>
